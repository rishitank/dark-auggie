name: AI Changelog

on:
  workflow_dispatch:
    inputs:
      since:
        description: Optional git since range (e.g., '2 weeks ago')
        required: false
      from:
        description: Optional from ref/tag/sha
        required: false
      to:
        description: Optional to ref/tag/sha
        required: false
      output:
        description: Output file path
        default: CHANGELOG_AI.md
        required: false
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install deps
        run: npm ci

      - name: Generate AI Changelog
        env:
          AUGMENT_SESSION_AUTH: ${{ secrets.AUGMENT_SESSION_AUTH }}
          AUGMENT_API_URL: ${{ secrets.AUGMENT_API_URL }}
          AUGMENT_API_TOKEN: ${{ secrets.AUGMENT_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Inputs go through env and a bash array: interpolating them into the
          # script was a shell-injection risk, and the escaped quotes were
          # passed to the script literally, splitting values like '2 weeks ago'.
          INPUT_SINCE: ${{ github.event.inputs.since }}
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_OUTPUT: ${{ github.event.inputs.output }}
        run: |
          args=()
          if [ -n "${INPUT_SINCE}" ]; then args+=(--since "${INPUT_SINCE}"); fi
          if [ -n "${INPUT_FROM}" ]; then args+=(--from "${INPUT_FROM}"); fi
          if [ -n "${INPUT_TO}" ]; then args+=(--to "${INPUT_TO}"); fi
          if [ -n "${INPUT_OUTPUT}" ]; then args+=(--output "${INPUT_OUTPUT}"); fi
          echo "Running changelog with args: ${args[*]}"
          npm run -s changelog:ai -- "${args[@]}"

      - name: Commit and push changelog
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG_AI.md
          if git diff --cached --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi
          git commit -m "docs(changelog): update AI changelog [skip ci]"
          git push
